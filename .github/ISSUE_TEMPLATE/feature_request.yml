name: 🚀 Feature Request
description: Suggest a new feature or improvement for the game.
title: "[Feature] <Short Description>"
labels: [enhancement, feature]
projects: ["EmojiBachelor/Zedge Emoji App"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request
        Please describe the feature or improvement in detail.

  - type: textarea
    id: feature_description
    attributes:
      label: Description
      description: A clear and concise description of what the feature is and why it's useful.
      placeholder: "Add details here..."
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: Describe how this feature should work.
      placeholder: "The game should..."
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Any extra details, references, or screenshots.
      placeholder: "Links, references, or additional notes..."
