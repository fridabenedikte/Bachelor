name: Kotlin CI

on:
  pull_request:
    branches: [master]  # ✅ Runs tests when a PR targets master
  push:
    branches: [master]  # ✅ Runs tests after a PR is merged

jobs:
  test:
    name: Run Kotlin Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      - name: Run Core Tests (Parallel & Cached)
        run: ./gradlew :core:test --configuration-cache --parallel --build-cache --no-daemon

      - name: Run Android Tests (Parallel & Cached)
        run: ./gradlew :android:testDebugUnitTest --configuration-cache --parallel --build-cache --no-daemon
